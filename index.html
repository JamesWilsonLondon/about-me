<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>James Wilson</title>
<meta name="description" content="I hire product engineers for early-stage startups. This is a personal site wearing a chat interface.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2c.6 4.9 4.5 8.8 9.4 9.4v1.2C16.5 13.2 12.6 17.1 12 22c-.6-4.9-4.5-8.8-9.4-9.4v-1.2C7.5 10.8 11.4 6.9 12 2z' fill='%237BB89D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1410; --sidebar:#0A0E0B; --panel:#161C18; --panel-2:#1B221D;
  --border:#232924; --border-soft:#1B211C;
  --ink:#F5F2EA; --muted:#A8AFA9; --dim:#6B736D;
  --accent:#7BB89D; --accent-2:#9FD4B8; --accent-ink:#0F1410;
  --mark:#D97757;         /* the mark. Ethiq sage is var(--accent) if you ever want it back. */
  --accent-wash:rgba(123,184,157,.10); --accent-line:rgba(123,184,157,.28);
  --serif:'Playfair Display',Georgia,serif;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sw:266px;
}
:root[data-theme="light"]{
  --bg:#FAF9F5; --sidebar:#F0EEE7; --panel:#FFFFFF; --panel-2:#F5F3EC;
  --border:#E1DED4; --border-soft:#EAE7DE;
  --ink:#18201A; --muted:#5B655E; --dim:#8A938C;
  --accent:#2F5D4F; --accent-2:#3E7A66; --accent-ink:#FFFFFF;
  --mark:#C4623F;
  --accent-wash:rgba(47,93,79,.07); --accent-line:rgba(47,93,79,.22);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}
a{color:inherit}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--accent-line);color:var(--ink)}

/* ══ LAYOUT ══ */
#app{display:flex;height:100%}

/* ══ SIDEBAR ══ */
#sidebar{
  width:var(--sw);flex-shrink:0;background:var(--sidebar);
  border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;height:100%;
  transition:margin-left .28s cubic-bezier(.4,0,.2,1);
}
#sidebar.collapsed{margin-left:calc(var(--sw) * -1)}
.sb-top{padding:14px 14px 8px;display:flex;align-items:center;gap:9px}
.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14.5px;letter-spacing:-.01em;
  padding:4px 6px;margin-left:-6px;border-radius:8px;transition:.14s;text-align:left}
.brand:hover{background:var(--panel)}
.sb-collapse{margin-left:auto;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--dim)}
.sb-collapse:hover{background:var(--panel);color:var(--ink)}
.sb-links{display:flex;gap:7px;padding:6px 14px 12px}
.sb-link{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 4px;border:1px solid var(--border);border-radius:9px;
  font-size:12.5px;color:var(--muted);background:var(--panel);transition:.16s;
  text-decoration:none;white-space:nowrap;
}
.sb-link:hover{color:var(--ink);border-color:var(--accent-line);background:var(--panel-2)}
.sb-act{padding:0 8px}
.sb-btn{
  width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:9px;font-size:13.5px;color:var(--muted);transition:.14s;text-align:left;
}
.sb-btn:hover{background:var(--panel);color:var(--ink)}
.sb-btn.primary{color:var(--accent)}
#searchbox{
  display:none;margin:2px 8px 0;width:calc(100% - 16px);padding:8px 10px;
  background:var(--panel);border:1px solid var(--accent-line);border-radius:9px;
  color:var(--ink);font-size:13.5px;font-family:inherit;outline:none;
}
#searchbox::placeholder{color:var(--dim)}
.sb-head{
  padding:18px 18px 6px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim);font-weight:500;
}
#recents{flex:1;overflow-y:auto;padding:0 8px 12px;min-height:0}
.rec{
  width:100%;display:block;text-align:left;padding:7px 10px;border-radius:8px;
  font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;transition:.14s;
}
.rec:hover{background:var(--panel);color:var(--ink)}
.rec.active{background:var(--panel-2);color:var(--ink)}
.rec-empty{padding:8px 10px;font-size:12.5px;color:var(--dim);font-style:italic}
.sb-foot{border-top:1px solid var(--border-soft);padding:10px}
.who{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:9px;transition:.14s}
.who:hover{background:var(--panel)}
.who-av{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;
}
.who-t{min-width:0;text-align:left}
.who-n{display:block;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-p{display:block;font-size:11.5px;color:var(--dim);line-height:1.3}

/* ══ MAIN ══ */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#topbar{
  height:50px;flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:0 16px;border-bottom:1px solid transparent;
}
.tb-btn{width:30px;height:30px;border-radius:8px;display:none;place-items:center;color:var(--muted)}
.tb-btn:hover{background:var(--panel);color:var(--ink)}
#tb-title{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
#theme{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
#theme:hover{background:var(--panel);color:var(--ink)}

#scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.col{max-width:720px;margin:0 auto;padding:0 24px}

/* ══ HOME ══ */
#home{padding:6vh 24px 40px;animation:rise .5s cubic-bezier(.2,.7,.3,1)}
.hi{
  font-family:var(--serif);font-size:clamp(30px,5.2vw,45px);line-height:1.15;
  font-weight:500;letter-spacing:-.015em;display:flex;align-items:center;
  gap:14px;flex-wrap:wrap;margin-bottom:14px;
}
.hi em{font-style:italic;color:var(--accent)}
.hi .mark{flex-shrink:0;display:inline-flex;margin-right:-2px}
.hi-sub{color:var(--muted);font-size:14.5px;max-width:44ch;margin-bottom:26px}
.pick-lbl{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.pick{
  padding:8px 15px;border:1px solid var(--border);border-radius:999px;
  font-size:13.5px;color:var(--muted);background:var(--panel);transition:.18s;
}
.pick:hover{color:var(--ink);border-color:var(--accent-line)}
.pick.on{background:var(--accent-wash);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.sugg-lbl{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin:26px 0 10px}
.suggs{display:flex;flex-direction:column;border-top:1px solid var(--border-soft)}
.sugg{
  display:flex;align-items:center;gap:11px;padding:11px 4px;text-align:left;
  border-bottom:1px solid var(--border-soft);color:var(--muted);font-size:14px;transition:.14s;
}
.sugg:hover{color:var(--ink);padding-left:8px}
.sugg .arw{margin-left:auto;color:var(--dim);opacity:0;transition:.16s;font-size:13px}
.sugg:hover .arw{opacity:1}

/* ══ CHAT ══ */
#chat{padding:22px 24px 30px}
.turn{margin-bottom:30px}
.u-row{display:flex;justify-content:flex-end;margin-bottom:26px}
.u-msg{
  background:var(--panel);border:1px solid var(--border-soft);
  padding:11px 16px;border-radius:16px 16px 5px 16px;max-width:82%;font-size:14.5px;
  animation:rise .35s cubic-bezier(.2,.7,.3,1);
}
.a-row{display:flex;gap:14px;align-items:flex-start}
.a-mark{margin-top:2px;flex-shrink:0}
.a-body{min-width:0;flex:1}
.blk{animation:rise .34s cubic-bezier(.2,.7,.3,1)}
.blk+.blk{margin-top:14px}
.a-body p{font-size:15px}
.a-body p.lead{font-family:var(--serif);font-size:19.5px;line-height:1.45;letter-spacing:-.01em}
.a-body h4{
  font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.01em;
  margin-top:6px;
}
.a-body ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.a-body li{position:relative;padding-left:19px;font-size:14.5px}
.a-body li::before{
  content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;
  border-radius:50%;background:var(--accent);opacity:.75;
}
.a-body b,.a-body strong{font-weight:700;color:var(--ink)}
.a-body a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-line);transition:.14s}
.a-body a:hover{border-bottom-color:var(--accent)}
blockquote{
  border-left:2px solid var(--accent-line);padding:2px 0 2px 16px;
  font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);line-height:1.5;
}
.kv{width:100%;border-collapse:collapse;font-size:14px}
.kv td{padding:8px 0;border-bottom:1px solid var(--border-soft);vertical-align:top}
.kv tr:last-child td{border-bottom:none}
.kv td:first-child{
  width:36%;padding-right:18px;color:var(--dim);font-size:12px;
  letter-spacing:.05em;text-transform:uppercase;padding-top:10px;
}
.tool{
  display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 9px;max-width:100%;
  padding:6px 12px 6px 10px;
  border:1px solid var(--border);border-radius:8px;background:var(--panel);
  font-family:var(--mono);font-size:11.5px;color:var(--dim);
}
.tool .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
.tool .nm{color:var(--muted)}
.tool.done .dot{animation:none;opacity:.55}
.tool .dt{min-width:0}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lnk{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;
  border:1px solid var(--border);border-radius:999px;background:var(--panel);
  font-size:13px;color:var(--muted);text-decoration:none;transition:.16s;
}
.lnk:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-wash)}

/* artifact */
.art{border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}
.art-hd{display:flex;align-items:center;gap:12px;padding:13px 15px;width:100%;text-align:left;transition:.16s}
.art-hd:hover{background:var(--panel-2)}
.art-ic{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;
  background:var(--accent-wash);color:var(--accent);
}
.art-t{min-width:0;flex:1}
.art-n{display:block;font-size:13.5px;font-weight:500;color:var(--ink)}
.art-s{display:block;font-size:12px;color:var(--dim);line-height:1.4}
.art-cv{color:var(--dim);transition:transform .25s;flex-shrink:0}
.art.open .art-cv{transform:rotate(180deg)}
.art-bd{display:none;padding:2px 15px 16px;border-top:1px solid var(--border-soft)}
.art.open .art-bd{display:block;animation:rise .3s cubic-bezier(.2,.7,.3,1)}
.art-bd .blk:first-child{margin-top:14px}

.follow{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px;padding-top:20px;border-top:1px solid var(--border-soft)}
.follow-l{width:100%;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.fchip{
  padding:7px 13px;border:1px solid var(--border);border-radius:999px;
  font-size:13px;color:var(--muted);background:var(--panel);transition:.16s;text-align:left;
}
.fchip:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-wash)}

/* ══ COMPOSER ══ */
#dock{flex-shrink:0;padding:0 24px 12px;background:linear-gradient(to top,var(--bg) 62%,transparent)}
#dock .col{padding:0}
#comp{
  border:1px solid var(--border);border-radius:16px;background:var(--panel);
  padding:12px 13px 9px;transition:.2s;
}
#comp:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-wash)}
#input{
  width:100%;background:none;border:none;outline:none;resize:none;color:var(--ink);
  font-family:inherit;font-size:14.5px;line-height:1.6;max-height:150px;min-height:24px;
}
#input::placeholder{color:var(--dim)}
#input{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#input::-webkit-scrollbar{width:6px}
#input::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
.comp-b{display:flex;align-items:center;gap:8px;margin-top:8px}
#model{position:relative}
#model-btn{
  display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:7px;
  font-family:var(--mono);font-size:11.5px;color:var(--dim);transition:.14s;
}
#model-btn:hover{background:var(--panel-2);color:var(--muted)}
#model-menu{
  display:none;position:absolute;bottom:calc(100% + 8px);left:0;width:280px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:5px;box-shadow:0 12px 34px rgba(0,0,0,.35);z-index:60;
}
#model-menu.open{display:block;animation:rise .18s ease}
.mi{width:100%;text-align:left;padding:8px 10px;border-radius:8px;transition:.14s}
.mi:hover{background:var(--panel-2)}
.mi-n{font-family:var(--mono);font-size:12px;color:var(--ink);display:flex;align-items:center;gap:7px}
.mi-d{font-size:11.5px;color:var(--dim);margin-top:1px;line-height:1.45}
.mi.on .mi-n::after{content:"✓";color:var(--accent);margin-left:auto}
#send{
  margin-left:auto;width:31px;height:31px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);transition:.16s;
}
#send:hover{filter:brightness(1.08)}
#send:disabled{opacity:.32;cursor:default;filter:none}
#foot{
  text-align:center;font-size:11.5px;color:var(--dim);line-height:1.55;
  padding:9px 24px 12px;
}
#foot a{color:var(--dim);text-decoration:underline;text-underline-offset:2px}
#foot a:hover{color:var(--muted)}

#overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;
  animation:fade .2s ease;
}

.cursor{
  display:inline-block;width:7px;height:15px;background:var(--accent);
  vertical-align:-2px;margin-left:2px;animation:blink .9s step-end infinite;border-radius:1px;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

#scroll::-webkit-scrollbar,#recents::-webkit-scrollbar{width:9px}
#scroll::-webkit-scrollbar-thumb,#recents::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px;border:3px solid transparent;background-clip:content-box}
#scroll::-webkit-scrollbar-thumb:hover,#recents::-webkit-scrollbar-thumb:hover{background:var(--dim);background-clip:content-box}

@media(max-width:860px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;z-index:50;margin-left:calc(var(--sw) * -1);box-shadow:0 0 40px rgba(0,0,0,.4)}
  #sidebar.open{margin-left:0}
  #sidebar.collapsed{margin-left:calc(var(--sw) * -1)}
  .sb-collapse{display:grid}
  .tb-btn{display:grid}
  .col{padding:0 18px}
  #dock{padding:0 18px 10px}
  #home{padding:4vh 18px 30px}
  #chat{padding:22px 18px 30px}
  .hi{font-size:29px;gap:11px}
  .u-msg{max-width:88%}
  .a-row{gap:11px}
  .kv td:first-child{width:38%}
  .tool{align-items:flex-start}
  .tool .dt{flex:1 1 100%;padding-left:14px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  #scroll{scroll-behavior:auto}
}
</style>
</head>
<body>
<div id="app">

  <!-- ══════ SIDEBAR ══════ -->
  <aside id="sidebar">
    <div class="sb-top">
      <button class="brand" onclick="goHome()" title="Back to the start"><span id="brand-mark"></span> James Wilson</button>
      <button class="sb-collapse" onclick="toggleSidebar()" aria-label="Close sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <div class="sb-links">
      <a class="sb-link" href="mailto:james@ethiqrec.com">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>Email</a>
      <a class="sb-link" href="https://www.linkedin.com/in/james-wilson-92170656/" target="_blank" rel="noopener">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM10 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.5 4.78 5.75V21h-4v-5.6c0-1.34-.03-3.06-1.9-3.06-1.9 0-2.2 1.45-2.2 2.96V21h-4z"/></svg>LinkedIn</a>
      <a class="sb-link" href="https://www.whatnext.dev" target="_blank" rel="noopener">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>Pod</a>
    </div>
    <div class="sb-act">
      <button class="sb-btn primary" onclick="goHome()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
      <button class="sb-btn" id="search-btn" onclick="openSearch()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search history</button>
      <input id="searchbox" placeholder="Filter conversations..." autocomplete="off">
    </div>
    <div class="sb-head" id="rec-head">Recents</div>
    <nav id="recents"></nav>
    <div class="sb-foot">
      <button class="who" onclick="goHome()">
        <span class="who-av" id="who-av">V</span>
        <span class="who-t"><span class="who-n" id="who-n">Visitor</span><span class="who-p" id="who-p">Free plan</span></span>
      </button>
    </div>
  </aside>
  <div id="overlay" onclick="toggleSidebar()"></div>

  <!-- ══════ MAIN ══════ -->
  <div id="main">
    <div id="topbar">
      <button class="tb-btn" onclick="toggleSidebar()" aria-label="Open sidebar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <span id="tb-title">James Wilson</span>
      <div id="tb-right">
        <button id="theme" onclick="toggleTheme()" aria-label="Toggle theme"></button>
      </div>
    </div>

    <div id="scroll">
      <div id="home" class="col"></div>
      <div id="chat" class="col" style="display:none"></div>
    </div>

    <div id="dock">
      <div class="col">
        <div id="comp">
          <textarea id="input" rows="1" placeholder="Ask me something..."></textarea>
          <div class="comp-b">
            <div id="model">

/* ═══════════════════════════════════════════════════════════
   THE ENGINE
   ═══════════════════════════════════════════════════════════ */

const $  = s => document.querySelector(s);
const byId = id => T.find(t => t.id === id);
const state = { aud:'nosy', model:0, threadId:null, typers:[], instant:false, seen:new Set(), busy:false };

const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; };

/* The mark. Six rounded capsules rotated in 30 degree steps, which reads as a
   twelve spoke burst. Two are trimmed slightly so it is not perfectly uniform.
   Colour comes from --mark in :root. */
const SPOKES = [[0,94],[30,88],[60,94],[90,90],[120,94],[150,88]];
function markSVG(size){
  let r = '';
  for(const [deg,h] of SPOKES){
    r += '<rect x="-4.6" y="'+(-h/2)+'" width="9.2" height="'+h+'" rx="4.6" transform="rotate('+deg+')"/>';
  }
  return '<svg width="'+size+'" height="'+size+'" viewBox="-50 -50 100 100" aria-hidden="true">'+
         '<g fill="var(--mark)">'+r+'</g></svg>';
}
const mark      = s => markSVG(s);
const markSmall = s => markSVG(s);

/* ── AUDIENCE ── */
function threadsFor(a){ return T.filter(t => t.aud.includes(a)); }

function setAud(a, silent){
  state.aud = a;
  const A = AUD[a];
  $('#who-av').textContent = A.av;
  $('#who-n').textContent  = A.who;
  $('#who-p').textContent  = A.plan;
  renderSidebar();
  if(!silent) renderHome();
  try{ localStorage.setItem('jw-aud', a); }catch(e){}
}

/* ── SIDEBAR ── */
let filterTerm = '';
function renderSidebar(){
  const host = $('#recents'); host.innerHTML='';
  let list = threadsFor(state.aud);
  if(filterTerm){
    const f = filterTerm.toLowerCase();
    list = T.filter(t => (t.title+' '+t.q).toLowerCase().includes(f));
  }
  if(!list.length){ host.appendChild(el('div','rec-empty','Nothing matches. I am only one person.')); return; }
  list.forEach(t => {
    const b = el('button','rec'+(t.id===state.threadId?' active':''), t.title);
    b.onclick = () => { openThread(t.id); if(window.innerWidth<=860) closeSidebar(); };
    host.appendChild(b);
  });
}
function openSearch(){
  const s = $('#searchbox');
  s.style.display='block'; $('#search-btn').style.display='none'; s.focus();
}
$('#searchbox').addEventListener('input', e => { filterTerm = e.target.value.trim(); renderSidebar(); });
$('#searchbox').addEventListener('keydown', e => {
  if(e.key==='Escape'){ e.target.value=''; filterTerm=''; e.target.style.display='none'; $('#search-btn').style.display=''; renderSidebar(); }
});

function toggleSidebar(){
  const sb = $('#sidebar');
  if(window.innerWidth<=860){
    sb.classList.toggle('open');
    $('#overlay').style.display = sb.classList.contains('open') ? 'block' : 'none';
  } else sb.classList.toggle('collapsed');
}
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#overlay').style.display='none'; }

/* ── BLOCK RENDERING ── */
function makeBlock(b){
  if(b.t==='p'){ return el('p','blk'+(b.lead?' lead':''), b.c); }
  if(b.t==='h'){ return el('h4','blk', b.c); }
  if(b.t==='q'){ return el('blockquote','blk', b.c); }
  if(b.t==='ul'){
    const u = el('ul','blk');
    b.c.forEach(i => u.appendChild(el('li',null,i)));
    return u;
  }
  if(b.t==='kv'){
    const wrap = el('div','blk');
    const tb = el('table','kv');
    b.c.forEach(([k,v]) => {
      const tr = el('tr');
      tr.appendChild(el('td',null,k));
      tr.appendChild(el('td',null,v));
      tb.appendChild(tr);
    });
    wrap.appendChild(tb); return wrap;
  }
  if(b.t==='links'){
    const w = el('div','blk links');
    b.c.forEach(l => {
      const a = el('a','lnk', l.l+' <span style="opacity:.6">&rarr;</span>');
      a.href=l.h; if(!l.h.startsWith('mailto')){ a.target='_blank'; a.rel='noopener'; }
      w.appendChild(a);
    });
    return w;
  }
  if(b.t==='art'){
    const w = el('div','blk art');
    const hd = el('button','art-hd');
    hd.innerHTML = '<span class="art-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5M9 13h6M9 17h4"/></svg></span>'+
      '<span class="art-t"><span class="art-n">'+b.title+'</span><span class="art-s">'+b.sub+'</span></span>'+
      '<span class="art-cv"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span>';
    const bd = el('div','art-bd');
    b.b.forEach(x => bd.appendChild(makeBlock(x)));
    hd.onclick = () => w.classList.toggle('open');
    w.appendChild(hd); w.appendChild(bd);
    return w;
  }
  return el('div','blk','');
}

/* ── TYPEWRITER ── */
function typeEl(node, speed, done){
  if(state.instant){ done&&done(); return; }
  const items=[];
  (function walk(n){
    Array.prototype.forEach.call(n.childNodes, c => {
      if(c.nodeType===3){ const t=c.nodeValue; if(t){ items.push({node:c, parts:t.match(/\s+|\S+/g)||[]}); c.nodeValue=''; } }
      else if(c.nodeType===1) walk(c);
    });
  })(node);
  if(!items.length){ done&&done(); return; }

  const cur = el('span','cursor'); node.appendChild(cur);
  let i=0, j=0;
  const handle = { finish };
  state.typers.push(handle);
  const timer = setInterval(step, speed);

  function finish(){
    clearInterval(timer);
    items.forEach(o => o.node.nodeValue = o.parts.join(''));
    if(cur.parentNode) cur.remove();
    state.typers = state.typers.filter(x => x!==handle);
    done && done();
  }
  function step(){
    let n = 2;
    while(n-- > 0){
      if(i >= items.length){ finish(); return; }
      const it = items[i];
      if(j >= it.parts.length){ i++; j=0; continue; }
      it.node.nodeValue += it.parts[j++];
    }
    autoscroll();
  }
}
function skipAll(){
  if(!state.typers.length && !state.busy) return;
  state.instant = true;
  state.typers.slice().forEach(h => h.finish());
}

/* ── SCROLL ── */
function autoscroll(force){
  const s = $('#scroll');
  const near = s.scrollHeight - s.scrollTop - s.clientHeight < 220;
  if(near || force) s.scrollTop = s.scrollHeight;
}

/* ── ANSWERING ── */
function playBlocks(host, blocks, i, cb){
  if(i >= blocks.length){ cb && cb(); return; }
  const b = blocks[i];
  const node = makeBlock(b);
  host.appendChild(node);
  autoscroll();
  const textual = ['p','h','q','ul'].includes(b.t);
  if(textual) typeEl(node, 17, () => playBlocks(host, blocks, i+1, cb));
  else setTimeout(() => playBlocks(host, blocks, i+1, cb), state.instant ? 0 : 170);
}

function answer(t){
  state.instant = false; state.busy = true;
  $('#send').disabled = true;

  const chat = $('#chat');
  const turn = el('div','turn');
  const urow = el('div','u-row'); urow.appendChild(el('div','u-msg', t.q));
  turn.appendChild(urow);

  const arow = el('div','a-row');
  arow.appendChild(el('div','a-mark', mark(21)));
  const body = el('div','a-body');
  arow.appendChild(body); turn.appendChild(arow);
  chat.appendChild(turn);
  autoscroll(true);

  const run = () => playBlocks(body, t.b, 0, () => finishAnswer(body, t));

  if(t.tool){
    const chip = el('div','blk tool');
    chip.innerHTML = '<span class="dot"></span><span class="nm">'+t.tool.n+'</span><span class="dt">'+t.tool.d+'</span>';
    body.appendChild(chip);
    setTimeout(() => { chip.classList.add('done'); run(); }, state.instant ? 0 : 780);
  } else run();
}

function finishAnswer(body, t){
  state.busy = false; $('#send').disabled = false;
  state.seen.add(t.id);

  const f = el('div','follow');
  f.appendChild(el('div','follow-l','Keep going'));
  (t.next||[]).forEach(id => {
    const n = byId(id); if(!n) return;
    const c = el('button','fchip', n.title);
    c.onclick = () => openThread(id);
    f.appendChild(c);
  });
  body.appendChild(f);
  prefill(nextUp(t));
  autoscroll();
}

function nextUp(t){
  const pool = threadsFor(state.aud);
  const unseen = pool.find(x => !state.seen.has(x.id) && x.id !== t.id);
  if(unseen) return unseen;
  const fromNext = (t.next||[]).map(byId).find(Boolean);
  return fromNext || pool[0];
}

function prefill(t){
  if(!t) return;
  const inp = $('#input');
  inp.value = t.q;
  inp.dataset.thread = t.id;
  sizeInput();
}

function openThread(id, opts){
  const t = byId(id); if(!t) return;
  skipAll();
  state.threadId = id;
  document.title = t.title + ' | James Wilson';
  $('#tb-title').textContent = t.title;
  $('#home').style.display = 'none';
  const chat = $('#chat');
  chat.style.display = '';
  if(!opts || !opts.append) chat.innerHTML = '';
  renderSidebar();
  answer(t);
  closeSidebar();
}

/* ── FREE TEXT ── */
const STOP = new Set(['the','a','an','is','are','was','and','or','to','of','in','on','for','he','him','his','james','me','i','you','what','how','why','do','does','about','it','that','this','with','at','be','can','any','actually','really','tell','ask']);
function match(q){
  const words = q.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w => w.length>2 && !STOP.has(w));
  if(!words.length) return null;
  let best=null, bestScore=0;
  T.forEach(t => {
    const hay = (t.title+' '+t.q+' '+t.id+' '+JSON.stringify(t.b)).toLowerCase();
    let s=0; words.forEach(w => { if(hay.includes(w)) s += (t.title+' '+t.q).toLowerCase().includes(w) ? 3 : 1; });
    if(s>bestScore){ bestScore=s; best=t; }
  });
  return bestScore >= 3 ? best : null;
}

function askCustom(text){
  const hit = match(text);
  if(hit){ openThread(hit.id); return; }

  state.instant=false; state.busy=true; $('#send').disabled=true;
  $('#home').style.display='none';
  const chat = $('#chat'); chat.style.display='';
  const turn = el('div','turn');
  const urow = el('div','u-row'); urow.appendChild(el('div','u-msg', text));
  turn.appendChild(urow);
  const arow = el('div','a-row');
  arow.appendChild(el('div','a-mark', mark(21)));
  const body = el('div','a-body'); arow.appendChild(body); turn.appendChild(arow);
  chat.appendChild(turn); autoscroll(true);

  const blocks = [
    {t:'p', lead:true, c:'I have not written that one.'},
    {t:'p', c:'This is not a model, it is me with a text editor and a limited amount of free time. So the coverage has gaps, and you have just found one.'},
    {t:'p', c:'Ask me directly at <a href="mailto:james@ethiqrec.com">james@ethiqrec.com</a>, which is faster than it sounds. Or try one of the ones I did get around to writing.'}
  ];
  playBlocks(body, blocks, 0, () => {
    state.busy=false; $('#send').disabled=false;
    const f = el('div','follow');
    f.appendChild(el('div','follow-l','Try one of these'));
    threadsFor(state.aud).slice(0,4).forEach(t => {
      const c = el('button','fchip', t.title);
      c.onclick = () => openThread(t.id);
      f.appendChild(c);
    });
    body.appendChild(f);
    prefill(threadsFor(state.aud)[0]);
    autoscroll();
  });
}

function submit(){
  if(state.busy) { skipAll(); return; }
  const inp = $('#input');
  const text = inp.value.trim();
  if(!text) return;
  const pre = inp.dataset.thread;
  const t = pre && byId(pre);
  inp.value=''; delete inp.dataset.thread; sizeInput();
  if(t && text === t.q) openThread(t.id, {append: !!state.threadId});
  else askCustom(text);
}

/* ── INPUT ── */
function sizeInput(){
  const i = $('#input');
  i.style.height='auto';
  i.style.height = Math.min(i.scrollHeight, 150)+'px';
}
$('#input').addEventListener('input', () => { delete $('#input').dataset.thread; sizeInput(); });
$('#input').addEventListener('keydown', e => {
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submit(); }
});

function renderModel(){
  const m = $('#model-menu'); m.innerHTML='';
  MODELS.forEach((mod,i) => {

    b.innerHTML = '<div class="mi-n">'+mod.n+'</div><div class="mi-d">'+mod.d+'</div>';

    m.appendChild(b);

}
function toggleModel(e){ e.stopPropagation(); $('#model-menu').classList.toggle('open'); }
document.addEventListener('click', () => $('#model-menu').classList.remove('open'));

/* ── THEME ── */
const SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  $('#theme').innerHTML = t==='light' ? MOON : SUN;
  try{ localStorage.setItem('jw-theme', t); }catch(e){}
}
function toggleTheme(){
  applyTheme(document.documentElement.getAttribute('data-theme')==='light' ? 'dark' : 'light');
}

/* ── PLAYBACK ── */
function playback(){
  const seq = ['start','why-site','path'];
  let i = 0;
  const step = () => {
    if(i >= seq.length) return;
    const t = byId(seq[i++]);
    prefill(t);
    setTimeout(() => {
      openThread(t.id, {append: i>1});
      const wait = setInterval(() => {
        if(!state.busy){ clearInterval(wait); setTimeout(step, 1700); }
      }, 300);
    }, 900);
  };
  setTimeout(step, 700);
}

/* ── BOOT ── */
(function init(){
  $('#brand-mark').innerHTML = markSmall(15);
  const sysLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  let th = sysLight ? 'light' : 'dark';
  try{ th = localStorage.getItem('jw-theme') || th; }catch(e){}
  applyTheme(th);
  renderModel();

  const params = new URLSearchParams(location.search);
  let a = params.get('as');
  if(!a){ try{ a = localStorage.getItem('jw-aud'); }catch(e){} }
  setAud(AUD[a] ? a : 'nosy', true);
  renderHome();

  document.getElementById('scroll').addEventListener('click', e => {
    if(e.target.closest('button, a')) return;
    skipAll();
  });
  document.addEventListener('keydown', e => {
    if(e.key==='Escape'){ skipAll(); closeSidebar(); }
  });

  const deep = params.get('t');
  if(deep && byId(deep)) { openThread(deep); }
  else if(params.get('mode')==='playback') playback();
})();
